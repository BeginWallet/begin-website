<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Forms</title><meta name="robots" content="noindex"></head>
<body>
<!-- Netlify Forms detects this static form at deploy time. The waitlist form on
     the homepage (components/transition/transition-landing.tsx) posts here. -->
<form name="waitlist" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="waitlist">
  <input name="bot-field">
  <input type="email" name="email">
</form>
</body>
</html>
